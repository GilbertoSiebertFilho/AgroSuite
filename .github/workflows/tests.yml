# Runs the test suite on every pull request and every push to main.
#
# Windows is the machine the app is used on, and where the path bugs this
# suite has caught (8.3 short TEMP, backslashes in ZIP entries) live.
# Ubuntu keeps run.sh honest.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # the "Run workflow" button on the Actions tab

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false      # a failure on one system still reports the other
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the suite
        run: python -m pytest tests/ -q
